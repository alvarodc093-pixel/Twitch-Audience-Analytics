name: Ingesta diaria de datos

on:
  schedule:
    - cron: '0 18 * * *'  # Todos los dias a las 18:00 UTC
  workflow_dispatch:  # Boton manual para ejecutar

permissions:
  contents: write  # para hacer commit de la base actualizada

jobs:
  ingesta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Las credenciales se guardan en Settings > Secrets and variables > Actions
      - name: Ejecutar ingesta
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python ingesta.py

      - name: Reconstruir corpus
        run: python preparar_corpus.py

      - name: Commit y push cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/twitch_pulse.db data/chroma/
          git diff --cached --quiet || git commit -m "data: ingesta automatica $(date +'%Y-%m-%d %H:%M')"
          git push
